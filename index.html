<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrosel em HTML e CSS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Criação da div que irá receber a estrutura de controle do carrossel -->
<div class="carousel-container">
        <!-- Radio Buttons (invisíveis) para controle do slide-->
        <input type="radio" name="slider" id="slide1" checked> 
        <input type="radio" name="slider" id="slide2">
        <input type="radio" name="slider" id="slide3">
        
        <!-- Container dos Slides (imagens)-->
         <div class="slides">
            <div class="slide-1">
                <img src="https://picsum.photos/800/400?random=1" alt="Imagem 1">
                <div class="caption">Primeira Imagem</div>
            </div>
            <div class="slide-2">
                <img src="https://picsum.photos/800/400?random=2" alt="Imagem 2">
                <div class="caption">Segunda Imagem</div>
            </div>
            <div class="slide-3">
                <img src="https://picsum.photos/800/400?random=3" alt="Imagem 3">
                <div class="caption">Terceira Imagem</div>
            </div>
         </div>

         <!--Navegação por Bolinhos (Bullets)-->
        <div class="navigation">
            <label for="slide1" class="bar"></label>
            <label for="slide2" class="bar"></label>
            <label for="slide3" class="bar"></label>
        </div>    
</div>
</body>
</html>
